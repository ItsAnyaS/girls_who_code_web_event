    <script async defer src="./index.js">
        function changeColor(color){
            console.log('This is being called')
            if (color == 'pink'){
                document.body.style.backgroundColor = '#f5c6e7';
            } else if (color == 'lavender'){
                document.body.style.backgroundColor = '#e6e6fa';
            } else if (color == 'green'){
                document.body.style.backgroundColor = '#98fb98';
            }
        }
    </script>

<body>
    <main>
        <h1 id="title">Hello world</h1>
        <button onclick="changeColor('pink')"> Pink </button>
        <button onclick="changeColor('lavender')"> Lavender </button>
        <button onclick="changeColor('green')">green</button>
        
    </main>

    <script>
         function changeColor(color){
            console.log('This is being called')
            if (color == 'pink'){
                document.body.style.backgroundColor = '#f5c6e7';
            } else if (color == 'lavender'){
                document.body.style.backgroundColor = '#e6e6fa';
            } else if (color == 'green'){

            }
        }
